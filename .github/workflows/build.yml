name: Build
permissions:
  contents: read
  pull-requests: write

# Build the ESPHome firmwares for the S0tool project.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: 🏗️ Build firmware 🛠️
    uses: esphome/workflows/.github/workflows/build.yml@main
    with:
      files: |
        esphome/watermeter.yaml
        esphome/pulscounter.yaml
        esphome/S0-puls-kwhpuls.yaml
        esphome/S0-puls-DSZ12D.yaml
        esphome/S0-puls-LEM022SJ.yaml
        esphome/s0-watermeter.yaml
        esphome/wsz15d32a.yaml
        esphome/sdm72d.yaml
        esphome/puls-water-internal.yaml
        esphome/kwh-water-test.yaml
        esphome/pulscounter_flux.yaml
      esphome-version: 2026.8.0
      release-summary: ${{ github.event_name == 'release' && github.event.release.body || '' }}
      release-url: ${{ github.event_name == 'release' && github.event.release.html_url || '' }}
      release-version: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  consolidate:
    name: Consolidate firmwares 🚀
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Download built firmwares
        uses: actions/download-artifact@v8.0.1
        with:
          path: firmwares

      - name: Remove intermediate version folder
        run: |-
          for d in firmwares/*/*; do
            if [ -d "$d" ]; then
              mv $d/* $d/../
              rm -rf $d
            fi
          done

      - name: Copy files
        run: |-
          mkdir -p output
          cp -R static/* output/ || true
          cp -R firmwares/* output/ || true

      - name: Remove intermediate version folder
  run: |-
    for d in firmwares/*/*/*; do
      if [ -d "$d" ]; then
        mv "$d"/* "${d%/*/*}/"
        rm -rf "${d%/*}"
      fi
    done
      - name: Copy manifest files to per-device folders and modify paths
        run: |-
          # Ensure jq is available (ubuntu-latest includes jq)
          set -euo pipefail
          for device_dir in firmwares/*; do
            [ -d "$device_dir" ] || continue
            device=$(basename "$device_dir")
            mkdir -p "output/$device"
            if [ -f "firmwares/$device/manifest.json" ]; then
              jq --arg device "$device" \
                '.builds[].ota.path |= $device + "/" + . | (.builds[].parts // [])[].path |= $device + "/" + .' \
                "firmwares/$device/manifest.json" > "output/$device/manifest.json"
            else
              echo "Warning: firmwares/$device/manifest.json not found, skipping manifest for $device"
            fi
          done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: output

  deploy:
    if: github.ref == 'refs/heads/main'
    name: 🏗️ Deploy to GitHub Pages 🚀
    runs-on: ubuntu-latest
    needs: consolidate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: 🏗️ Setup website pages
        uses: actions/configure-pages@v6.0.0
      - name: 🏗️ Deploy Firmware to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
