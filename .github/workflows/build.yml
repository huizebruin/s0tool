name: Build

permissions:
  contents: read        # typically needed for checkout, adjust as required
  pages: write          # allow publishing to GitHub Pages
  id-token: write       # allow OIDC/id-token usage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      bypass-yaml-check:
        description: 'Bypass YAML change check (force build/publish)'
        type: boolean
        required: false
        default: false
  release:
    types: [published]

jobs:
  build-and-publish:
    uses: ./.github/workflows/reusable-build.yml
    with:
      device-name: s0tool
      yaml-files: |
        esphome/watermeter.yaml
        esphome/pulscounter.yaml
        esphome/S0-puls-kwhpuls.yaml
        esphome/S0-puls-DSZ12D.yaml
        esphome/S0-puls-LEM022SJ.yaml
        esphome/s0-watermeter.yaml
        esphome/wsz15d32a.yaml
        esphome/sdm72d.yaml
        esphome/puls-water-internal.yaml
        esphome/kwh-water-test.yaml
        esphome/pulscounter_flux.yaml
      esphome-version: 2026.8.0
      check-yaml-changes: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.bypass-yaml-check == 'true') }}
      publish-to-pages: true
      has-installer: true
      installer-path: static

  consolidate:
    name: Consolidate firmwares 🚀
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Download built firmwares
        uses: actions/download-artifact@v8.0.1
        with:
          path: firmwares

      - name: Flatten downloaded artifacts (remove version subfolders)
        run: |-
          set -euo pipefail
          shopt -s nullglob
          echo "Flattening firmwares/*/* -> firmwares/* (remove intermediate version folders)"
          for device_dir in firmwares/*; do
            [ -d "$device_dir" ] || continue
            for sub in "$device_dir"/*; do
              if [ -d "$sub" ]; then
                echo "Moving contents of $sub -> $device_dir"
                mv -v "$sub"/* "$device_dir"/ || true
                rm -rf "$sub"
              fi
            done
          done
          echo "Flatten complete. Current layout:"
          ls -laR firmwares || true

      - name: Copy files (follow symlinks, avoid links/hardlinks)
        run: |-
          set -euo pipefail
          mkdir -p output

          echo "Copying static/ -> output/ (follow symlinks)"
          if [ -d static ]; then
            rsync -rL --delete --exclude='.git' static/ output/ || true
          fi

          echo "Copying firmwares/ -> output/ (follow symlinks)"
          if [ -d firmwares ]; then
            rsync -rL --delete firmwares/ output/ || true
          fi

          echo "Listing any symlinks in output (should be none):"
          find output -type l -print || true

          # Remove any symlinks just in case
          find output -type l -exec echo "Removing symlink:" {} \; -exec rm -vf {} \; || true

          # Report total size in KB and fail early if > 10GB (Pages limit)
          size_kb=$(du -sk output | cut -f1 || echo 0)
          echo "Total output size (KB): $size_kb"
          max_kb=$((10 * 1024 * 1024))
          if [ "$size_kb" -ge "$max_kb" ]; then
            echo "ERROR: artifact size >= 10GB (limit for Pages). Aborting upload."
            exit 1
          fi

          echo "Files copied, size OK."

      - name: Copy manifest files to per-device folders and modify paths
        run: |-
          set -euo pipefail
          echo "Ensuring per-device manifest.json under output/<device>/manifest.json"
          for device_dir in firmwares/*; do
            [ -d "$device_dir" ] || continue
            device=$(basename "$device_dir")
            mkdir -p "output/$device"
            if [ -f "$device_dir/manifest.json" ]; then
              jq --arg device "$device" \
                '.builds[].ota.path |= $device + "/" + . | (.builds[].parts // [])[].path |= $device + "/" + .' \
                "$device_dir/manifest.json" > "output/$device/manifest.json"
              echo "Wrote output/$device/

