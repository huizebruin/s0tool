name: Build

permissions:
  contents: read        # typically needed for checkout, adjust as required
  pages: write          # allow publishing to GitHub Pages
  id-token: write       # allow OIDC/id-token usage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      bypass-yaml-check:
        description: 'Bypass YAML change check (force build/publish)'
        type: boolean
        required: false
        default: false
  release:
    types: [published]

jobs:
  build-and-publish:
    uses: ./.github/workflows/reusable-build.yml
    with:
      device-name: s0tool
      yaml-files: |
        esphome/watermeter.yaml
        esphome/pulscounter.yaml
        esphome/S0-puls-kwhpuls.yaml
        esphome/S0-puls-DSZ12D.yaml
        esphome/S0-puls-LEM022SJ.yaml
        esphome/s0-watermeter.yaml
        esphome/wsz15d32a.yaml
        esphome/sdm72d.yaml
        esphome/puls-water-internal.yaml
        esphome/kwh-water-test.yaml
        esphome/pulscounter_flux.yaml
      esphome-version: 2026.8.0
      check-yaml-changes: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.bypass-yaml-check == 'true') }}
      publish-to-pages: true
      has-installer: true
      installer-path: static

  consolidate:
    name: Consolidate firmwares 🚀
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Download built firmwares
        uses: actions/download-artifact@v8.0.1
        with:
          path: firmwares

      - name: Prepare output (flatten, copy files, write manifests, debug)
        run: |-
          set -euo pipefail
          shopt -s nullglob

          echo "=== Flattening downloaded artifacts (remove version subfolders) ==="
          for device_dir in firmwares/*; do
            [ -d "$device_dir" ] || continue
            for sub in "$device_dir"/*; do
              if [ -d "$sub" ]; then
                echo "Moving contents of $sub -> $device_dir"
                mv -v "$sub"/* "$device_dir"/ || true
                rm -rf "$sub"
              fi
            done
          done
          echo "Flatten complete."
          ls -laR firmwares || true

          echo
          echo "=== Copying static/ and firmwares/ -> output/ (follow symlinks) ==="
          mkdir -p output
          if [ -d static ]; then
            rsync -rL --delete --exclude='.git' static/ output/ || true
          fi
          if [ -d firmwares ]; then
            rsync -rL --delete firmwares/ output/ || true
          fi

          echo
          echo "=== Ensure per-device manifest.json under output/<device>/manifest.json ==="
          for device_dir in firmwares/*; do
            [ -d "$device_dir" ] || continue
            device=$(basename "$device_dir")
            mkdir -p "output/$device"
            if [ -f "$device_dir/manifest.json" ]; then
              jq --arg device "$device" \
                '.builds[].ota.path |= $device + "/" + . | (.builds[].parts // [])[].path |= $device + "/" + .' \
                "$device_dir/manifest.json" > "output/$device/manifest.json"
              echo "Wrote output/$device/manifest.json"
            else
              echo "Warning: $device_dir/manifest.json not found, skipping manifest for $device"
            fi
          done

          echo
          echo "=== Remove any symlinks in output (safety) ==="
          find output -type l -print -exec rm -vf {} \; || true

          echo
          echo "=== Report output size (KB) and check limit ==="
          size_kb=$(du -sk output | cut -f1 || echo 0)
          echo "Total output size (KB): $size_kb"
          max_kb=$((10 * 1024 * 1024))
          if [ "$size_kb" -ge "$max_kb" ]; then
            echo "ERROR: artifact size >= 10GB (limit for Pages). Aborting upload."
            exit 1
          fi

          echo
          echo "=== Debug: list output contents ==="
          ls -laR output || true
          echo
          echo "=== Debug: manifests found (per-device) ==="
          for m in output/*/manifest.json; do
            if [ -f "$m" ]; then
              echo "---- $m ----"
              jq . "$m" || cat "$m"
            fi
          done
          echo "=== end debug ==="

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: output

  deploy:
    if: github.ref == 'refs/heads/main'
    name: 🏗️ Deploy to GitHub Pages 🚀
    runs-on: ubuntu-latest
    needs: consolidate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: 🏗️ Setup website pages
        uses: actions/configure-pages@v6.0.0
      - name: 🏗️ Deploy Firmware to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
