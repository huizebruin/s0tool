name: Build
permissions:
  contents: read
  pull-requests: write

# Build the ESPHome firmwares for the S0tool project.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: 🏗️ Build firmware 🛠️
    uses: esphome/workflows/.github/workflows/build.yml@main
    with:
      files: |
        esphome/watermeter.yaml
        esphome/pulscounter.yaml
        esphome/S0-puls-kwhpuls.yaml
        esphome/S0-puls-DSZ12D.yaml
        esphome/S0-puls-LEM022SJ.yaml
        esphome/s0-watermeter.yaml
        esphome/wsz15d32a.yaml
        esphome/sdm72d.yaml
        esphome/puls-water-internal.yaml
        esphome/kwh-water-test.yaml
        esphome/pulscounter_flux.yaml
      esphome-version: 2026.10.0
      release-summary: ${{ github.event_name == 'release' && github.event.release.body || '' }}
      release-url: ${{ github.event_name == 'release' && github.event.release.html_url || '' }}
      release-version: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  consolidate:
    name: Consolidate firmwares 🚀
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Download built firmwares
        uses: actions/download-artifact@v8.0.2
        with:
          path: firmwares
          # Each device artifact already embeds its own name as the
          # top-level folder inside the artifact (so we end up with
          # firmwares/<name>/<version>/...). Without merge-multiple,
          # download v8 wraps every artifact in an extra
          # <artifact-name>/ folder on top of that, giving
          # firmwares/<name>/<name>/<version>/... merge-multiple
          # restores the intended single-nesting layout.
          merge-multiple: true

      - name: Remove intermediate version folder
        run: |-
          for d in firmwares/*/*; do
            if [ -d "$d" ]; then
              mv $d/* $d/../
              rm -rf $d
            fi
          done

      # Generates static/s0tool_translations.zip and .json (download + language picker on
      # translations.html) from s0tool_translations/. continue-on-error: if something is wrong
      # with a translation, the site and firmware still deploy; the "Translations" workflow
      # reports the problem and the picker shows a fallback message.
      - name: Set up Python (translations)
        continue-on-error: true
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build translation files
        continue-on-error: true
        run: |-
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check_translations.py --build

      - name: Copy files
        run: |-
          mkdir -p output
          cp -R static/* output/ || true
          cp -R firmwares/* output/ || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: output

  deploy:
    if: github.ref == 'refs/heads/main'
    name: 🏗️ Deploy to GitHub Pages 🚀
    runs-on: ubuntu-latest
    needs: consolidate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: 🏗️ Setup website pages
        uses: actions/configure-pages@v6.0.0
      - name: 🏗️ Deploy Firmware to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
