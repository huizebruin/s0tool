name: Translations

# Checks the language files in s0tool_translations/ and that the website files
# (static/s0tool_translations.zip and .json) can be built from them.
# Read-only: it commits nothing and does not touch the firmware build, the
# release workflow or the GitHub Pages deployment. The website files are not
# stored in git; build.yml generates them on every site build.
#
# To try the same thing locally:
#   pip install pyyaml
#   python3 .github/scripts/check_translations.py --build
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "s0tool_translations/**"
      - ".github/scripts/check_translations.py"
      - ".github/workflows/translations.yml"
  pull_request:
    paths:
      - "s0tool_translations/**"
      - ".github/scripts/check_translations.py"
      - ".github/workflows/translations.yml"
  workflow_dispatch:

jobs:
  check:
    name: 🌍 Check translations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Check translations and build the website files
        run: python .github/scripts/check_translations.py --build

      - name: Show the generated files
        run: ls -l static/s0tool_translations.zip static/s0tool_translations.json
