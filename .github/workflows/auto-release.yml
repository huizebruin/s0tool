name: Auto release

# Maakt automatisch een release (en tag) zodra project_version in
# esphome/components/basis.yaml verandert.
#
# Release-notities = EN + NL uit CHANGELOG.en.md / CHANGELOG.md
#                    + de Release Drafter-lijst (.github/release-drafter.yml)
#
# De release start daarna build.yml (release: published), die de firmware bouwt.

on:
  push:
    branches: [main]
    paths:
      - "esphome/components/basis.yaml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Versie uit basis.yaml lezen
        id: ver
        run: |
          VERSION=$(grep -E '^\s*project_version:' esphome/components/basis.yaml \
            | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$VERSION" ]; then
            echo "::error::Geen project_version gevonden in basis.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versie: $VERSION"

      - name: Bestaat de tag al?
        id: tag
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag bestaat al, niets te doen."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Changelog EN + NL
        if: steps.tag.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          sect() { awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' "$1"; }
          sect CHANGELOG.md > nl.md
          sect CHANGELOG.en.md > en.md
          [ -s nl.md ] || { echo "::error::Geen sectie [$V] in CHANGELOG.md"; exit 1; }
          [ -s en.md ] || { echo "::error::No section [$V] in CHANGELOG.en.md"; exit 1; }

      - name: Release Drafter (zelfde indeling als altijd)
        if: steps.tag.outputs.exists == 'false'
        id: drafter
        uses: release-drafter/release-drafter@v7.10.0
        with:
          tag: ${{ steps.ver.outputs.version }}
          name: Release v${{ steps.ver.outputs.version }}
          version: ${{ steps.ver.outputs.version }}
          commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Notities samenstellen
        if: steps.tag.outputs.exists == 'false'
        env:
          DRAFT_BODY: ${{ steps.drafter.outputs.body }}
        run: |
          {
            echo "## 🇬🇧 English"; cat en.md
            echo; echo "## 🇳🇱 Nederlands"; cat nl.md
            echo; echo "---"; echo
            printf '%s\n' "$DRAFT_BODY"
          } > notes.md
          cat notes.md

      - name: Concept publiceren als release
        if: steps.tag.outputs.exists == 'false'
        env:
          # Met een PAT (secret RELEASE_TOKEN) start de release ook build.yml.
          # Met alleen GITHUB_TOKEN wordt de release wel gemaakt, maar start er
          # GEEN build (beperking van GitHub).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.drafter.outputs.id }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -f tag_name="$V" \
            -f name="Release v$V" \
            -f target_commitish="${{ github.sha }}" \
            -F body=@notes.md \
            -F draft=false \
            -F make_latest=true
