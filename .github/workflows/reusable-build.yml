name: Build and Publish (reusable)

on:
  workflow_call:
    inputs:
      device-name:
        required: true
        type: string
      yaml-files:
        required: true
        type: string
      firmware-names:
        required: false
        type: string
      core-yaml-path:
        required: false
        type: string
      esphome-version:
        required: false
        type: string
      check-yaml-changes:
        required: false
        type: boolean
      publish-to-pages:
        required: false
        type: boolean
      has-installer:
        required: false
        type: boolean
      installer-path:
        required: false
        type: string
      release-summary:
        required: false
        type: string
      release-url:
        required: false
        type: string
      release-version:
        required: false
        type: string

jobs:
  build:
    name: 🏗️ Build firmware 🛠️
    uses: esphome/workflows/.github/workflows/build.yml@main
    with:
      files: ${{ inputs.yaml-files }}
      esphome-version: ${{ inputs.esphome-version }}
      release-summary: ${{ inputs.release-summary }}
      release-url: ${{ inputs.release-url }}
      release-version: ${{ inputs.release-version }}

  consolidate:
    name: Consolidate firmwares 🚀
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Download built firmwares
        uses: actions/download-artifact@v8.0.1
        with:
          path: firmwares
      - name: Remove intermediate version folder
        run: |-
          for d in firmwares/*/*; do
            if [ -d "$d" ]; then
              mv $d/* $d/../
              rm -rf $d
            fi
          done
      - name: Copy files
        run: |-
          mkdir output
          cp -RL static/* output/ || true
          cp -RL firmwares/* output/ || true
      - name: Copy files (follow symlinks, avoid links/hardlinks)
        run: |
          set -euo pipefail
          mkdir -p output
      
          echo "Copying static/ -> output/ (follow symlinks)"
          if [ -d static ]; then
            rsync -rL --delete --exclude='.git' static/ output/ || true
          fi
      
          echo "Copying firmwares/ -> output/ (follow symlinks)"
          if [ -d firmwares ]; then
            rsync -rL --delete firmwares/ output/ || true
          fi
      
          echo "Listing any symlinks in output (should be none):"
          find output -type l -print || true
      
          # Remove any symlinks just in case (they shouldn't exist after rsync -L, but be safe)
          find output -type l -exec echo "Removing symlink:" {} \; -exec rm -vf {} \; || true
      
          # Report total size in KB and fail early if > 10GB (10 * 1024 * 1024 KB)
          size_kb=$(du -sk output | cut -f1 || echo 0)
          echo "Total output size (KB): $size_kb"
          max_kb=$((10 * 1024 * 1024))
          if [ "$size_kb" -ge "$max_kb" ]; then
            echo "ERROR: artifact size >= 10GB (limit for Pages). Aborting upload."
            exit 1
          fi
      
          echo "Output prepared, size OK."
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: output
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    name: 🏗️ Deploy to GitHub Pages 🚀
    runs-on: ubuntu-latest
    needs: consolidate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: 🏗️ Setup website pages
        uses: actions/configure-pages@v6.0.0
      - name: 🏗️ Deploy Firmware to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
