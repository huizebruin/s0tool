sensor.totaal_opgebracht:
  friendly_name: "Total energy"
sensor.actuele_meterstand:
  friendly_name: "Current meter reading"
number.pulsrate_kwh:
  friendly_name: "Pulse rate kWh"
sensor.watermeter_flow:
  friendly_name: "Water meter flow"
sensor.watermeter_totaal:
  friendly_name: "Water meter total"
sensor.watermeter_stand:
  friendly_name: "Water meter reading"
sensor.watermeter_totaal_l:
  friendly_name: "Water meter total (L)"
sensor.watermeter_pulse:
  friendly_name: "Water meter pulse"
select.pulsrate_water_per_m3:
  friendly_name: "Pulse rate water per m3"
number.initiele_meterstand_m3:
