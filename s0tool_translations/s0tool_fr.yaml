# S0tool - Français (fr)
# Changes only the displayed name (friendly_name) in Home Assistant. Entity IDs stay the same,
# so dashboards, utility meters and the Energy dashboard keep working.
#
# Use, in configuration.yaml (use ONE language file):
#   homeassistant:
#     customize: !include s0tool_translations/s0tool_fr.yaml
# Copy this file to your Home Assistant config folder (keep the s0tool_translations/ folder).
# Already have a customize file? Copy the entries you want into it.
# Then restart Home Assistant or run 'Reload customizations'. More info: s0tool_translations/README.md

## ESPHome entities (names from esphome/components/*.yaml)
sensor.actuele_energie:
  friendly_name: "Puissance actuelle"
sensor.totaal_opgebracht:
  friendly_name: "Énergie totale"
sensor.actuele_meterstand:
  friendly_name: "Index du compteur actuel"
number.pulsrate_kwh:
  friendly_name: "Taux d'impulsions kWh"
sensor.watermeter_flow:
  friendly_name: "Débit du compteur d'eau"
sensor.watermeter_totaal:
  friendly_name: "Compteur d'eau total"
sensor.watermeter_stand:
  friendly_name: "Index du compteur d'eau"
sensor.watermeter_totaal_l:
  friendly_name: "Compteur d'eau total (L)"
sensor.watermeter_pulse:
  friendly_name: "Impulsion du compteur d'eau"
select.pulsrate_water_per_m3:
  friendly_name: "Taux d'impulsions eau par m3"
number.initiele_meterstand_m3:
  friendly_name: "Index initial m3"
sensor.gasmeter_pulse:
  friendly_name: "Impulsion du compteur de gaz"
sensor.gasmeter_totaal:
  friendly_name: "Compteur de gaz total"
sensor.gasmeter_stand:
  friendly_name: "Index du compteur de gaz"
number.pulsrate_gas_per_m3:
  friendly_name: "Taux d'impulsions gaz par m3"

