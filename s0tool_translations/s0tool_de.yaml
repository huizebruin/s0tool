# S0tool - Deutsch (de)
# Changes only the displayed name (friendly_name) in Home Assistant. Entity IDs stay the same,
# so dashboards, utility meters and the Energy dashboard keep working.
#
# Use, in configuration.yaml (use ONE language file):
#   homeassistant:
#     customize: !include s0tool_translations/s0tool_de.yaml
# Copy this file to your Home Assistant config folder (keep the s0tool_translations/ folder).
# Already have a customize file? Copy the entries you want into it.
# Then restart Home Assistant or run 'Reload customizations'. More info: s0tool_translations/README.md

## ESPHome entities (names from esphome/components/*.yaml)
